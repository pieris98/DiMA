defaults:
  - model: conditional_bert
  - encoder: esm2_8m
  - decoder: default
  - datasets: swissprot
  - dataloader: default
  - scheduler: tanh
  - dynamic: sde
  - solver: euler
  - optimizer: adamw
  - lr_scheduler: cosine
  - metrics: default
  - structure_generation: default
  - _self_

conditional:
  type: fold
  dim: 320
  cross_attention: true

ddp:
  enabled: false
  local_rank: 0
  global_rank: 0

project:
  seed: 42
  path: "${oc.env:PROJECT_ROOT,${WORK}/AMPERE/DiMA}"
  wandb_project: "test"
  checkpoints_prefix: "conditional-fold-esm2-8m-test"
  checkpoints_folder: "${project.path}/checkpoints"
  diffusion_checkpoints_folder: "${project.checkpoints_folder}/diffusion_checkpoints"
  decoder_checkpoints_folder: "${project.checkpoints_folder}/decoder_checkpoints"
  statistics_folder: "${project.checkpoints_folder}/statistics"

s3:
  bucket: "dima-protein-diffusion"
  region: "eu-north-1"

training:
  training_iters: 20
  eval_interval: 10
  save_interval: 20
  batch_size: 4
  batch_size_per_gpu: 4
  ema_rate: 0.9999
  grad_clip_norm: 1.0
  init_se: ""

generation:
  t_min: 0.05
  N_steps: 2000
  batch_size: 256
  num_gen_samples: 2048
  save_dir: "${project.path}/generated_sequences"
