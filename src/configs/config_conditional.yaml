defaults:
  - model: conditional_bert
  - encoder: esm2_8m
  - decoder: transformer
  - datasets: swissprot
  - dataloader: default
  - scheduler: tanh
  - dynamic: sde
  - solver: euler
  - optimizer: adamw
  - lr_scheduler: cosine
  - metrics: default
  - structure_generation: default
  - _self_

conditional:
  type: fold
  dim: 320
  cross_attention: true
  num_families: 8

ddp:
  enabled: true
  local_rank: 0
  global_rank: 0

project:
  seed: 42
  path: "${oc.env:PROJECT_ROOT,$WORK/AMPERE/DiMA}"
  wandb_project: "dima-conditional"
  checkpoints_prefix: "conditional-${conditional.type}-esm2_8m"
  checkpoints_folder: "${project.path}/checkpoints"
  diffusion_checkpoints_folder: "${project.checkpoints_folder}/diffusion_checkpoints"
  decoder_checkpoints_folder: "${project.checkpoints_folder}/decoder_checkpoints"
  statistics_folder: "${project.checkpoints_folder}/statistics"

s3:
  bucket: "dima-protein-diffusion"
  region: "eu-north-1"

training:
  training_iters: 1000000
  eval_interval: 50000
  save_interval: 50000
  batch_size: 256
  batch_size_per_gpu: 32
  ema_rate: 0.9999
  grad_clip_norm: 1.0

generation:
  t_min: 0.05
  N_steps: 2000
  batch_size: 256
  num_gen_samples: 2048
  save_dir: "${project.path}/generated_sequences"
